name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: intania-888
  REGION: asia-southeast1
  IMAGE_NAME: asia-southeast1-docker.pkg.dev/intania-888/intania888/intania-888-backend
  DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Build, migrate, and deploy
    if: >-
      github.repository == 'esc-chula/intania-888-backend' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_sha == github.sha &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Finish an active migration/deployment before starting another release.
    concurrency:
      group: intania888-production
      cancel-in-progress: false

    steps:
      - name: Checkout the commit that passed Quality
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_COMMIT }}
          persist-credentials: false

      - name: Skip a release superseded by a newer main commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [[ "$DEPLOY_COMMIT" == "$current_main" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo '::notice::A newer main commit exists; skipping this superseded release.'
          fi

      # Build before authenticating so build time does not consume token lifetime.
      - name: Build the production image
        if: steps.release.outputs.current == 'true'
        run: docker build --platform linux/amd64 --tag "$IMAGE_NAME:$DEPLOY_COMMIT" .

      - name: Authenticate to Google Cloud
        if: steps.release.outputs.current == 'true'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/461083215931/locations/global/workloadIdentityPools/intania888-github/providers/backend-production
          service_account: intania888-deployer@intania-888.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false

      - name: Set up Cloud SDK
        if: steps.release.outputs.current == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Publish the image and deploy
        if: steps.release.outputs.current == 'true'
        env:
          # A one-hour impersonated token covers the migration job and rollout.
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE_NAME:$DEPLOY_COMMIT"

          digest=$(gcloud artifacts docker images describe "$IMAGE_NAME:$DEPLOY_COMMIT" \
            --project="$PROJECT_ID" \
            --format='value(image_summary.digest)')

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Artifact Registry did not return a valid image digest.' >&2
            exit 1
          fi

          bash scripts/deploy-production.sh "$IMAGE_NAME@$digest"
