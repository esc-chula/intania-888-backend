basePath: /api/v1
definitions:
  apierror.Response:
    properties:
      code:
        type: string
      details:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      request_id:
        type: string
    type: object
  auth.ExternalTokenResponse:
    properties:
      expires_in:
        type: integer
      id:
        type: string
      token:
        type: string
    type: object
  auth.MeResponse:
    properties:
      csrf_token:
        type: string
      profile:
        $ref: '#/definitions/model.UserDto'
    type: object
  auth.externalTokenRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  event.SpinResponse:
    properties:
      candidates:
        items:
          $ref: '#/definitions/model.CandidatePreviewDto'
        type: array
      reward:
        type: string
      slots:
        items:
          type: string
        type: array
      stealToken:
        $ref: '#/definitions/model.StealTokenDto'
    type: object
  model.AdminUpdateUserDto:
    properties:
      group_id:
        type: string
      name:
        type: string
      nick_name:
        type: string
      remaining_coin:
        example: "888.88"
        type: string
    required:
    - name
    type: object
  model.BillHeadDto:
    properties:
      id:
        type: string
      lines:
        items:
          $ref: '#/definitions/model.BillLineDto'
        type: array
      payout:
        type: string
      settled_at:
        type: string
      status:
        type: string
      total:
        example: "100.00"
        type: string
      user_id:
        type: string
      voided_at:
        type: string
    type: object
  model.BillLineDto:
    properties:
      betting_on:
        type: string
      bill_id:
        type: string
      match:
        $ref: '#/definitions/model.MatchDto'
      match_id:
        type: string
      rate:
        type: number
    type: object
  model.CandidatePreviewDto:
    properties:
      group_id:
        type: string
      index:
        type: integer
      name:
        type: string
      role_id:
        type: string
    type: object
  model.ColorDto:
    properties:
      drawn:
        type: integer
      id:
        type: string
      lost:
        type: integer
      title:
        type: string
      total_matches:
        type: integer
      won:
        type: integer
    type: object
  model.CreateBillLineRequest:
    properties:
      betting_on:
        type: string
      match_id:
        type: string
    required:
    - betting_on
    - match_id
    type: object
  model.CreateBillRequest:
    properties:
      lines:
        items:
          $ref: '#/definitions/model.CreateBillLineRequest'
        minItems: 1
        type: array
      total:
        example: "100.00"
        type: string
    required:
    - lines
    - total
    type: object
  model.CreateMatchRequest:
    properties:
      end_time:
        type: string
      start_time:
        type: string
      team_a:
        type: string
      team_b:
        type: string
      type:
        type: string
    required:
    - end_time
    - start_time
    - team_a
    - team_b
    - type
    type: object
  model.CreateMineGameRequest:
    properties:
      bet_amount:
        type: string
      risk_level:
        enum:
        - low
        - medium
        - high
        type: string
    required:
    - bet_amount
    - risk_level
    type: object
  model.DailyRewardScheduleItem:
    properties:
      amount:
        type: string
      date:
        type: string
    type: object
  model.DailyRewardScheduleResponse:
    properties:
      default_amount:
        type: string
      overrides:
        items:
          $ref: '#/definitions/model.DailyRewardScheduleItem'
        type: array
    type: object
  model.DeductCoinRequest:
    properties:
      amount:
        type: string
    required:
    - amount
    type: object
  model.DeductCoinResponse:
    properties:
      deducted_amount:
        type: string
      remaining_balance:
        type: string
      success:
        type: boolean
    type: object
  model.MatchDto:
    properties:
      end_time:
        type: string
      id:
        type: string
      is_draw:
        type: boolean
      start_time:
        type: string
      team_a:
        type: string
      team_a_rate:
        type: number
      team_a_score:
        type: integer
      team_b:
        type: string
      team_b_rate:
        type: number
      team_b_score:
        type: integer
      type:
        type: string
      winner:
        type: string
    type: object
  model.MatchResultRequest:
    properties:
      outcome:
        enum:
        - winner
        - draw
        type: string
      winner_id:
        type: string
    required:
    - outcome
    type: object
  model.MatchesByDate:
    properties:
      date:
        type: string
      types:
        items:
          $ref: '#/definitions/model.MatchesByType'
        type: array
    type: object
  model.MatchesByType:
    properties:
      matches:
        items:
          $ref: '#/definitions/model.MatchDto'
        type: array
      sportType:
        type: string
    type: object
  model.MineGameDto:
    properties:
      bet_amount:
        type: string
      completed_at:
        type: string
      created_at:
        type: string
      current_payout:
        type: string
      grid:
        items:
          $ref: '#/definitions/model.MineTileDto'
        type: array
      id:
        type: string
      multiplier:
        type: number
      revealed_count:
        type: integer
      risk_level:
        type: string
      status:
        type: string
      user_id:
        type: string
    type: object
  model.MineGameHistoryDto:
    properties:
      bet_amount:
        type: string
      completed_at:
        type: string
      created_at:
        type: string
      final_payout:
        type: string
      game_id:
        type: string
      multiplier:
        type: number
      revealed_count:
        type: integer
      risk_level:
        type: string
      status:
        type: string
    type: object
  model.MineGameStatsDto:
    properties:
      active_current_payout:
        type: string
      active_wagered:
        type: string
      games_cashed_out:
        type: integer
      games_lost:
        type: integer
      games_won:
        type: integer
      net_profit:
        type: string
      total_games:
        type: integer
      total_wagered:
        type: string
      total_winnings:
        type: string
      win_rate:
        type: number
    type: object
  model.MineTileDto:
    properties:
      index:
        type: integer
      revealed:
        type: boolean
      type:
        description: diamond, bomb, hidden
        type: string
    type: object
  model.RevealMineTileRequest:
    properties:
      index:
        maximum: 15
        minimum: 0
        type: integer
    required:
    - index
    type: object
  model.ScoreDto:
    properties:
      team_a_score:
        minimum: 0
        type: integer
      team_b_score:
        minimum: 0
        type: integer
    required:
    - team_a_score
    - team_b_score
    type: object
  model.SetDailyRewardRequest:
    properties:
      amount:
        type: string
    required:
    - amount
    type: object
  model.SportTypeDto:
    properties:
      id:
        type: string
      title:
        type: string
    type: object
  model.StealTokenDto:
    properties:
      expires_at:
        type: string
      message:
        type: string
      token:
        type: string
      victim_count:
        type: integer
    type: object
  model.UpdateMatchRequest:
    properties:
      end_time:
        type: string
      start_time:
        type: string
      team_a:
        type: string
      team_b:
        type: string
      type:
        type: string
    type: object
  model.UseStealTokenRequestDto:
    properties:
      token:
        type: string
      victim_index:
        minimum: 0
        type: integer
    required:
    - token
    - victim_index
    type: object
  model.UseStealTokenResponseDto:
    properties:
      all_candidates:
        items:
          $ref: '#/definitions/model.VictimDetailDto'
        type: array
      message:
        type: string
      raider_new_balance:
        type: string
      total_stolen:
        type: string
    type: object
  model.UserDto:
    properties:
      created_at:
        type: string
      email:
        type: string
      group_id:
        type: string
      id:
        type: string
      name:
        type: string
      nick_name:
        type: string
      remaining_coin:
        example: "888.88"
        type: string
      role_id:
        type: string
    type: object
  model.VictimDetailDto:
    properties:
      amount_stolen:
        type: string
      balance_before:
        type: string
      group_id:
        type: string
      index:
        type: integer
      name:
        type: string
      role_id:
        type: string
      user_id:
        type: string
      was_chosen:
        type: boolean
    type: object
  model.VoidBillRequest:
    properties:
      reason:
        type: string
    required:
    - reason
    type: object
  policy.AccessPolicy:
    properties:
      created_at:
        type: string
      enabled:
        type: boolean
      expires_at:
        type: string
      id:
        type: string
      kind:
        type: string
      principal:
        type: string
      principal_type:
        type: string
      reason:
        type: string
      updated_at:
        type: string
    type: object
  policy.CreatePolicyRequest:
    properties:
      expires_at:
        type: string
      kind:
        enum:
        - allowlist
        - blacklist
        type: string
      principal:
        type: string
      principal_type:
        enum:
        - email
        - google_subject
        type: string
      reason:
        type: string
    required:
    - kind
    - principal
    - principal_type
    - reason
    type: object
  policy.PolicyListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/policy.AccessPolicy'
        type: array
      next_cursor:
        type: string
    type: object
  policy.UpdatePolicyRequest:
    properties:
      enabled:
        type: boolean
      expires_at:
        type: string
      reason:
        type: string
    type: object
  stakemine.CashOutResponse:
    properties:
      game:
        $ref: '#/definitions/model.MineGameDto'
      message:
        type: string
    type: object
  stakemine.HistoryListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.MineGameHistoryDto'
        type: array
      limit:
        type: integer
      offset:
        type: integer
    type: object
  stakemine.RevealTileResponse:
    properties:
      game:
        $ref: '#/definitions/model.MineGameDto'
      message:
        type: string
    type: object
  user.UpdateOwnProfileRequest:
    properties:
      group_id:
        type: string
        x-nullable: true
      name:
        type: string
      nick_name:
        type: string
        x-nullable: true
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    Breaking backend release: all Money fields are fixed two-decimal strings and the current frontend is incompatible until migrated.
    All failed /api/v1 requests use the apierror.Response schema with stable codes and X-Request-ID. See docs/README.md for the code catalog and frontend migration handoff.
  title: Intania888 Backend - API
  version: 1.0.0-breaking
paths:
  /auth/callback:
    get:
      description: Exchanges a state-bound Google authorization code and establishes
        a cookie session.
      parameters:
      - description: OAuth authorization code
        in: query
        name: code
        required: true
        type: string
      - description: OAuth state nonce
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: fixed frontend redirect
          schema:
            type: string
        "400":
          description: invalid OAuth request
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: email is not allowed
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: post-login redirect is not configured
          schema:
            $ref: '#/definitions/apierror.Response'
        "503":
          description: OAuth login or access policy unavailable
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: Complete Google OAuth login
      tags:
      - Auth
  /auth/external-tokens:
    post:
      deprecated: true
      parameters:
      - description: existing user
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.externalTokenRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.ExternalTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - CookieSession: []
      summary: Issue a one-hour external JWT
      tags:
      - Auth
  /auth/external-tokens/{id}:
    delete:
      deprecated: true
      parameters:
      - description: token ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: revoked
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierror.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - CookieSession: []
      summary: Revoke an external JWT
      tags:
      - Auth
  /auth/login:
    get:
      description: Retrieves a Google OAuth login URL and binds it to a short-lived
        browser cookie.
      produces:
      - application/json
      responses:
        "200":
          description: authorization URL
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: redirect_to is not supported
          schema:
            $ref: '#/definitions/apierror.Response'
        "503":
          description: OAuth login unavailable
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: Start Google OAuth login
      tags:
      - Auth
  /auth/logout:
    post:
      description: Revokes the active server-side session and clears its browser cookie.
        An absent or expired session is already logged out.
      responses:
        "204":
          description: logged out
        "403":
          description: invalid CSRF token
          schema:
            $ref: '#/definitions/apierror.Response'
        "503":
          description: session store or revocation unavailable
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - CookieSession: []
      summary: Log out of browser session
      tags:
      - Auth
  /auth/me:
    get:
      description: Retrieves the profile and CSRF token associated with the browser
        session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MeResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/apierror.Response'
        "503":
          description: session or policy unavailable
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - CookieSession: []
      summary: Browser profile and CSRF token
      tags:
      - Auth
  /auth/policies:
    get:
      description: Lists allowlist and blacklist entries for an administrator.
      parameters:
      - description: allowlist or blacklist
        in: query
        name: kind
        type: string
      - description: email or google_subject
        in: query
        name: principal_type
        type: string
      - description: active, inactive, or all
        in: query
        name: status
        type: string
      - description: page size, maximum 200
        in: query
        name: limit
        type: integer
      - description: opaque pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/policy.PolicyListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - CookieSession: []
      summary: List access policies
      tags:
      - Auth Policy
    post:
      consumes:
      - application/json
      description: Creates an allowlist or blacklist entry.
      parameters:
      - description: access policy
        in: body
        name: policy
        required: true
        schema:
          $ref: '#/definitions/policy.CreatePolicyRequest'
      - description: Session-bound CSRF token returned by /auth/me
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/policy.AccessPolicy'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierror.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - CookieSession: []
      summary: Create access policy
      tags:
      - Auth Policy
  /auth/policies/{id}:
    delete:
      description: Disables an allowlist or blacklist entry.
      parameters:
      - description: policy ID
        in: path
        name: id
        required: true
        type: string
      - description: Session-bound CSRF token returned by /auth/me
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      responses:
        "204":
          description: policy disabled
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - CookieSession: []
      summary: Disable access policy
      tags:
      - Auth Policy
    patch:
      consumes:
      - application/json
      description: Updates reason, expiry, or enabled state. Identity and kind are
        immutable.
      parameters:
      - description: policy ID
        in: path
        name: id
        required: true
        type: string
      - description: policy changes
        in: body
        name: policy
        required: true
        schema:
          $ref: '#/definitions/policy.UpdatePolicyRequest'
      - description: Session-bound CSRF token returned by /auth/me
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/policy.AccessPolicy'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - CookieSession: []
      summary: Update access policy
      tags:
      - Auth Policy
  /bills:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.BillHeadDto'
            type: array
      security:
      - CookieSession: []
      summary: Get the authenticated user's bills
      tags:
      - Bill
    post:
      consumes:
      - application/json
      description: 'Breaking contract: money is a string and rates are calculated
        by the server.'
      parameters:
      - description: Bill stake and selections
        in: body
        name: bill
        required: true
        schema:
          $ref: '#/definitions/model.CreateBillRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.BillHeadDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apierror.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - CookieSession: []
      summary: Place an authoritative bill
      tags:
      - Bill
  /bills/{id}:
    get:
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BillHeadDto'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - CookieSession: []
      summary: Get a bill by ID
      tags:
      - Bill
  /bills/admin/{id}/void:
    put:
      consumes:
      - application/json
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      - description: Audit reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.VoidBillRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BillHeadDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - CookieSession: []
      summary: Void and refund a pending bill
