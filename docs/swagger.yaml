basePath: /api/v1
definitions:
  bill.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  color.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  model.BillHeadDto:
    properties:
      id:
        type: string
      lines:
        items:
          $ref: '#/definitions/model.BillLineDto'
        type: array
      payout:
        type: string
      settled_at:
        type: string
      status:
        type: string
      total:
        example: "100.00"
        type: string
      user_id:
        type: string
      voided_at:
        type: string
    type: object
  model.BillLineDto:
    properties:
      betting_on:
        type: string
      bill_id:
        type: string
      match:
        $ref: '#/definitions/model.MatchDto'
      match_id:
        type: string
      rate:
        type: number
    type: object
  model.ColorDto:
    properties:
      drawn:
        type: integer
      id:
        type: string
      lost:
        type: integer
      title:
        type: string
      total_matches:
        type: integer
      won:
        type: integer
    type: object
  model.CreateBillLineRequest:
    properties:
      betting_on:
        type: string
      match_id:
        type: string
    type: object
  model.CreateBillRequest:
    properties:
      lines:
        items:
          $ref: '#/definitions/model.CreateBillLineRequest'
        type: array
      total:
        example: "100.00"
        type: string
    type: object
  model.CreateMineGameRequest:
    properties:
      bet_amount:
        type: string
      risk_level:
        enum:
        - low
        - medium
        - high
        type: string
    required:
    - bet_amount
    - risk_level
    type: object
  model.DeductCoinRequest:
    properties:
      amount:
        type: string
    required:
    - amount
    type: object
  model.DeductCoinResponse:
    properties:
      deducted_amount:
        type: string
      remaining_balance:
        type: string
      success:
        type: boolean
    type: object
  model.MatchDto:
    properties:
      end_time:
        type: string
      id:
        type: string
      is_draw:
        type: boolean
      start_time:
        type: string
      team_a:
        type: string
      team_a_rate:
        type: number
      team_a_score:
        type: integer
      team_b:
        type: string
      team_b_rate:
        type: number
      team_b_score:
        type: integer
      type:
        type: string
      winner:
        type: string
    type: object
  model.MatchResultRequest:
    properties:
      outcome:
        type: string
      winner_id:
        type: string
    type: object
  model.MatchesByDate:
    properties:
      date:
        type: string
      types:
        items:
          $ref: '#/definitions/model.MatchesByType'
        type: array
    type: object
  model.MatchesByType:
    properties:
      matches:
        items:
          $ref: '#/definitions/model.MatchDto'
        type: array
      sportType:
        type: string
    type: object
  model.MineGameDto:
    properties:
      bet_amount:
        type: string
      completed_at:
        type: string
      created_at:
        type: string
      current_payout:
        type: string
      grid:
        items:
          $ref: '#/definitions/model.MineTileDto'
        type: array
      id:
        type: string
      multiplier:
        type: number
      revealed_count:
        type: integer
      risk_level:
        type: string
      status:
        type: string
      user_id:
        type: string
    type: object
  model.MineGameStatsDto:
    properties:
      active_current_payout:
        type: string
      active_wagered:
        type: string
      games_cashed_out:
        type: integer
      games_lost:
        type: integer
      games_won:
        type: integer
      net_profit:
        type: string
      total_games:
        type: integer
      total_wagered:
        type: string
      total_winnings:
        type: string
      win_rate:
        type: number
    type: object
  model.MineTileDto:
    properties:
      index:
        type: integer
      revealed:
        type: boolean
      type:
        description: diamond, bomb, hidden
        type: string
    type: object
  model.RevealMineTileRequest:
    properties:
      index:
        maximum: 15
        minimum: 0
        type: integer
    required:
    - index
    type: object
  model.ScoreDto:
    properties:
      team_a_score:
        type: integer
      team_b_score:
        type: integer
    type: object
  model.SetDailyRewardRequest:
    properties:
      amount:
        type: string
      date:
        type: string
    type: object
  model.SportTypeDto:
    properties:
      id:
        type: string
      title:
        type: string
    type: object
  model.UseStealTokenRequestDto:
    properties:
      token:
        type: string
      victim_index:
        type: integer
    type: object
  model.UseStealTokenResponseDto:
    properties:
      all_candidates:
        items:
          $ref: '#/definitions/model.VictimDetailDto'
        type: array
      message:
        type: string
      raider_new_balance:
        type: string
      total_stolen:
        type: string
    type: object
  model.UserDto:
    properties:
      created_at:
        type: string
      email:
        type: string
      group_id:
        type: string
      id:
        type: string
      name:
        type: string
      nick_name:
        type: string
      remaining_coin:
        example: "888.88"
        type: string
      role_id:
        type: string
    type: object
  model.VictimDetailDto:
    properties:
      amount_stolen:
        type: string
      balance_before:
        type: string
      group_id:
        type: string
      index:
        type: integer
      name:
        type: string
      role_id:
        type: string
      user_id:
        type: string
      was_chosen:
        type: boolean
    type: object
  model.VoidBillRequest:
    properties:
      reason:
        type: string
    type: object
  sporttype.ErrorResponse:
    properties:
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'Breaking backend release: all Money fields are fixed two-decimal strings
    and the current frontend is incompatible until migrated.'
  title: Intania888 Backend - API
  version: 1.0.0-breaking
paths:
  /auth/callback:
    get:
      description: Exchanges a state-bound Google authorization code and establishes
        a cookie session.
      parameters:
      - description: OAuth authorization code
        in: query
        name: code
        required: true
        type: string
      - description: OAuth state nonce
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: fixed frontend redirect
          schema:
            type: string
        "400":
          description: invalid OAuth request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: email is not allowed
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: OAuth Callback
      tags:
      - Auth
  /auth/login:
    get:
      description: Retrieves a Google OAuth login URL and binds it to a short-lived
        browser cookie.
      produces:
      - application/json
      responses:
        "200":
          description: authorization URL
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: redirect_to is not supported
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login URL
      tags:
      - Auth
  /auth/logout:
    post:
      description: Revokes the active server-side session and clears authentication
        cookies.
      responses:
        "204":
          description: logged out
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout
      tags:
      - Auth
  /auth/me:
    get:
      description: Retrieves the profile associated with the access cookie.
      produces:
      - application/json
      responses:
        "200":
          description: profile
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: GetMe
      tags:
      - Auth
  /auth/refresh:
    post:
      description: Rotates the refresh token from the HttpOnly cookie and replaces
        the session cookies.
      responses:
        "204":
          description: session refreshed
        "401":
          description: invalid or replayed refresh token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh Session
      tags:
      - Auth
  /bills:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.BillHeadDto'
            type: array
      security:
      - BearerAuth: []
      summary: Get the authenticated user's bills
      tags:
      - Bill
    post:
      consumes:
      - application/json
      description: 'Breaking contract: money is a string and rates are calculated
        by the server.'
      parameters:
      - description: Bill stake and selections
        in: body
        name: bill
        required: true
        schema:
          $ref: '#/definitions/model.CreateBillRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.BillHeadDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bill.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/bill.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Place an authoritative bill
      tags:
      - Bill
  /bills/{id}:
    get:
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BillHeadDto'
      security:
      - BearerAuth: []
      summary: Get a bill by ID
      tags:
      - Bill
  /bills/admin/{id}/void:
    put:
      consumes:
      - application/json
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      - description: Audit reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.VoidBillRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BillHeadDto'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/bill.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Void and refund a pending bill
      tags:
      - Bill
  /bills/admin/all:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.BillHeadDto'
            type: array
      security:
      - BearerAuth: []
      summary: Get all bills (admin)
      tags:
      - Bill
  /colors/group-stage:
    get:
      consumes:
      - application/json
      description: Get group stage table with group id and sport type
      parameters:
      - description: Type ID to filter
        in: query
        name: type_id
        type: string
      - description: Group ID to filter
        in: query
        name: group_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.ColorDto'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/color.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/color.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get group stage table
      tags:
      - Color
  /colors/leaderboards:
    get:
      consumes:
      - application/json
      description: Get all colors with their leaderboard info
      parameters:
      - description: Type ID to filter
        in: query
        name: type_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.ColorDto'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/color.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/color.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all color leaderboards
      tags:
      - Color
  /events/daily-rewards:
    post:
      consumes:
      - application/json
      description: Set daily reward amount for a specific date (admin only)
      parameters:
      - description: Daily reward request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.SetDailyRewardRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Set daily reward successful
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to set daily reward
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set daily reward
      tags:
      - Event
  /events/redeem/daily:
    get:
      consumes:
      - application/json
      description: Redeem daily reward for the logged-in user
      produces:
      - application/json
      responses:
        "200":
          description: redeemed daily reward successful
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: not found user profile in context
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Redeem daily reward
      tags:
      - Event
  /events/spin/slot:
    post:
      description: Spins the slot machine using the requested coin amount
      parameters:
      - description: Money string to spend (50, 100, or 500)
        in: query
        name: spendAmount
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: slot result
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid spend amount or user profile
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Spin the slot machine
      tags:
      - Event
  /events/use-steal-token:
    post:
      consumes:
      - application/json
      description: Uses a steal token against one of its eligible victims
      parameters:
      - description: Steal token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UseStealTokenRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: steal result
          schema:
            $ref: '#/definitions/model.UseStealTokenResponseDto'
        "400":
          description: invalid request or token
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: missing or invalid authorization
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Use a steal token
      tags:
      - Event
  /external/deduct-coin:
    post:
      consumes:
      - application/json
      description: External API endpoint to deduct coins from authenticated user's
        balance. Bypasses browser-only validation but requires JWT authentication.
      parameters:
      - description: Deduction request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.DeductCoinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.DeductCoinResponse'
        "400":
          description: Invalid amount or parse error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Insufficient balance or blacklisted
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Deduct coins from user balance (External API)
      tags:
      - External
  /external/me:
    get:
      description: Retrieves user profile data through Bearer authentication.
      produces:
      - application/json
      responses:
        "200":
          description: profile
          schema:
            additionalProperties: true
            type: object
        "401":
          description: missing or invalid authorization
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get profile (External API)
      tags:
      - External
  /matches:
    get:
      parameters:
      - description: Sport type ID
        in: query
        name: typeId
        type: string
      - description: schedule or result
        in: query
        name: schedule
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.MatchesByDate'
            type: array
      security:
      - BearerAuth: []
      summary: List matches
      tags:
      - Match
    post:
      consumes:
      - application/json
      parameters:
      - description: Match
        in: body
        name: match
        required: true
        schema:
          $ref: '#/definitions/model.MatchDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a match
      tags:
      - Match
  /matches/{id}:
    delete:
      parameters:
      - description: Match ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a match
      tags:
      - Match
    get:
      parameters:
      - description: Match ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.MatchDto'
      security:
      - BearerAuth: []
      summary: Get a match by ID
      tags:
      - Match
    put:
      consumes:
      - application/json
      parameters:
      - description: Match ID
        in: path
        name: id
        required: true
        type: string
      - description: Match
        in: body
        name: match
        required: true
        schema:
          $ref: '#/definitions/model.MatchDto'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update match details
      tags:
      - Match
  /matches/{id}/result:
    put:
      consumes:
      - application/json
      parameters:
      - description: Match ID
        in: path
        name: id
        required: true
        type: string
      - description: Winner or draw result
        in: body
        name: result
        required: true
        schema:
          $ref: '#/definitions/model.MatchResultRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Idempotently set a match result and settle affected bills
      tags:
      - Match
  /matches/{id}/score:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Match ID
        in: path
        name: id
        required: true
        type: string
      - description: Score
        in: body
        name: score
        required: true
        schema:
          $ref: '#/definitions/model.ScoreDto'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a match score
      tags:
      - Match
  /matches/current/time:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current server match time
      tags:
      - Match
  /mines/{id}:
    get:
      description: Get details of a specific Stake Mines game by ID
      parameters:
      - description: Game ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.MineGameDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get game details
      tags:
      - StakeMines
  /mines/{id}/cashout:
    post:
      description: Cash out and take winnings from an active Stake Mines game
      parameters:
      - description: Game ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cash out from the current game
      tags:
      - StakeMines
  /mines/{id}/reveal:
    post:
      consumes:
      - application/json
      description: Reveal a specific tile in an active Stake Mines game
      parameters:
      - description: Game ID
        in: path
        name: id
        required: true
        type: string
      - description: Reveal tile request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.RevealMineTileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Reveal a tile in the game
      tags:
      - StakeMines
  /mines/active:
    get:
      description: Get the current active Stake Mines game for the user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.MineGameDto'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get active game
      tags:
      - StakeMines
  /mines/create:
