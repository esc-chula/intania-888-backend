basePath: /api/v1
definitions:
  apierror.Response:
    properties:
      code:
        type: string
        description: Stable machine-readable error code. Clients should branch on this field rather than
          message text.
      details:
        additionalProperties:
          type: string
        type: object
        description: Optional field-level validation details keyed by request field.
      message:
        type: string
        description: Safe human-readable error summary.
      request_id:
        type: string
        description: Server-generated ID for tracing this request; also returned in X-Request-ID.
    type: object
    description: Response representation used by this API.
    example:
      code: INVALID_REQUEST
      message: Invalid request
      request_id: 5ef9fba0-0123-4abc-8123-0123456789ab
      details:
        total: must be a decimal string
  auth.MeResponse:
    properties:
      csrf_token:
        type: string
      profile:
        $ref: '#/definitions/model.UserDto'
    type: object
  event.SpinResponse:
    properties:
      candidates:
        items:
          $ref: '#/definitions/model.CandidatePreviewDto'
        type: array
      reward:
        type: string
        description: Exact-decimal amount represented as a JSON string with two fractional digits in responses.
      slots:
        items:
          type: string
        type: array
      stealToken:
        $ref: '#/definitions/model.StealTokenDto'
    type: object
  model.AdminUpdateUserDto:
    properties:
      group_id:
        type: string
        description: Identifier of the associated resource.
      name:
        type: string
      nick_name:
        type: string
      remaining_coin:
        example: '888.88'
        type: string
        description: New account balance as a decimal JSON string; the handler writes 0.00 when this field is omitted. Include the intended balance on every update. Numeric JSON tokens are rejected.
    required:
    - name
    type: object
  model.BillHeadDto:
    properties:
      id:
        type: string
        description: Unique bill identifier.
      lines:
        items:
          $ref: '#/definitions/model.BillLineDto'
        type: array
        description: Selections and server-calculated rates attached to this bill.
      payout:
        type: string
        description: Settlement payout as an exact-decimal string; absent until settled.
      settled_at:
        type: string
        description: Settlement timestamp in RFC 3339 format when settled.
      status:
        type: string
        description: Bill lifecycle state.
      total:
        example: '100.00'
        type: string
        description: Total stake as a JSON string with two fractional digits.
      user_id:
        type: string
        description: Identifier of the associated resource.
      voided_at:
        type: string
        description: Void timestamp in RFC 3339 format when voided.
    type: object
    description: BillHeadDto representation used by this API.
  model.BillLineDto:
    properties:
      betting_on:
        type: string
        description: Selected side for the associated match.
      bill_id:
        type: string
        description: Identifier of the associated resource.
      match:
        $ref: '#/definitions/model.MatchDto'
      match_id:
        type: string
        description: Identifier of the selected match.
      rate:
        example: '2.000000'
        type: string
        description: Server-calculated rate as a JSON string with six fractional digits.
    type: object
    description: BillLineDto representation used by this API.
  model.CandidatePreviewDto:
    properties:
      group_id:
        type: string
        description: Identifier of the associated resource.
      index:
        type: integer
      name:
        type: string
      role_id:
        type: string
        description: Identifier of the associated resource.
    type: object
  model.ColorDto:
    properties:
      drawn:
        type: integer
      id:
        type: string
        description: Identifier of the associated resource.
      lost:
        type: integer
      title:
        type: string
      total_matches:
        type: integer
      won:
        type: integer
    type: object
  model.CreateBillLineRequest:
    properties:
      betting_on:
        type: string
        description: 'Selection: team_a or team_b.'
      match_id:
        type: string
        description: Identifier of an existing match accepting bets.
    required:
    - betting_on
    - match_id
    type: object
    description: CreateBillLineRequest representation used by this API.
  model.CreateBillRequest:
    properties:
      lines:
        items:
          $ref: '#/definitions/model.CreateBillLineRequest'
        minItems: 1
        type: array
        description: One or more match selections to include in the bill.
      total:
        example: '100.00'
        type: string
        description: Positive total stake as a decimal string; numeric JSON values are rejected.
    required:
    - lines
    - total
    type: object
    description: CreateBillRequest representation used by this API.
  model.CreateMatchRequest:
    properties:
      end_time:
        type: string
        description: RFC 3339 timestamp; must be later than start_time.
      location_id:
        type: string
        example: CIVIL_COURT
        description: ID of an existing location returned by GET /locations.
      start_time:
        type: string
        description: RFC 3339 timestamp; must be earlier than end_time.
      team_a:
        type: string
        description: ID of the first team.
      team_b:
        type: string
        description: ID of the second team; it must differ from team_a.
      type:
        type: string
        description: Stable sport-type ID returned by GET /sport-types.
    required:
    - end_time
    - location_id
    - start_time
    - team_a
    - team_b
    - type
    type: object
    description: Required fields for creating a scheduled match.
  model.CreateMineGameRequest:
    properties:
      bet_amount:
        type: string
        description: Wager as a decimal JSON string. The accepted range is 1.00 through 1000000.00; numeric
          JSON tokens are rejected.
      risk_level:
        enum:
        - low
        - medium
        - high
        type: string
        description: 'Board risk level: low, medium, or high.'
    required:
    - bet_amount
    - risk_level
    type: object
  model.CreateSportTypeRequest:
    properties:
      id:
        example: BADMINTON_ALL
        maxLength: 100
        minLength: 1
        type: string
        description: 1–100 ASCII letters, digits, underscores, or hyphens.
        pattern: ^[A-Za-z0-9_-]+$
      title:
        example: Badminton
        maxLength: 100
        minLength: 1
        type: string
        description: Trimmed display title, 1–100 characters; duplicate titles are allowed.
    required:
    - id
    - title
    type: object
    description: CreateSportTypeRequest representation used by this API.
  model.DailyRewardScheduleItem:
    properties:
      amount:
        type: string
        description: Exact-decimal amount represented as a JSON string with two fractional digits in responses.
      date:
        type: string
        description: Reward date in DD-MM-YYYY format.
    type: object
  model.DailyRewardScheduleResponse:
    properties:
      default_amount:
        type: string
        description: Exact-decimal amount represented as a JSON string with two fractional digits in responses.
      overrides:
        items:
          $ref: '#/definitions/model.DailyRewardScheduleItem'
        type: array
    type: object
  model.MatchDto:
    properties:
      end_time:
        type: string
        description: Match end timestamp in RFC 3339 format.
      id:
        type: string
        description: Unique match identifier.
      location:
        $ref: '#/definitions/model.LocationDto'
        description: Assigned venue, including its stable ID and current display title.
      is_draw:
        type: boolean
        description: True when the terminal result is a draw.
      start_time:
        type: string
        description: Match start timestamp in RFC 3339 format.
      team_a:
        type: string
      team_a_rate:
        example: '1.750000'
        type: string
        description: Current server-calculated rate for team_a, represented with six fractional digits.
      team_a_score:
        type: integer
      team_b:
        type: string
      team_b_rate:
        example: '2.500000'
        type: string
        description: Current server-calculated rate for team_b, represented with six fractional digits.
      team_b_score:
        type: integer
      type:
        type: string
      winner:
        type: string
        description: Winning team ID, or empty when no winner is set.
    required:
    - location
    type: object
    description: Match resource included in match responses and nested bill lines, with the assigned location.
  model.MatchResultRequest:
    properties:
      outcome:
        enum:
        - winner
        - draw
        type: string
        description: Use winner with winner_id to select a winning team, or draw for a tie.
      winner_id:
        type: string
        description: Winning team ID; required when outcome is winner and omitted for draw.
    required:
    - outcome
    type: object
    description: Request to set a match to a winner or draw and settle affected bills.
  model.MatchesByDate:
    properties:
      date:
        type: string
        format: date-time
        description: UTC calendar date used to group the fixtures.
      types:
        items:
          $ref: '#/definitions/model.MatchesByType'
        type: array
    type: object
  model.MatchesByType:
    properties:
      matches:
        items:
          $ref: '#/definitions/model.MatchDto'
        type: array
      sportType:
        type: string
    type: object
  model.MineGameDto:
    properties:
      bet_amount:
        type: string
        description: Wager as a JSON string with two fractional digits.
      completed_at:
        type: string
        format: date-time
        description: Completion timestamp in RFC 3339 format; absent while the game is active.
      created_at:
        type: string
        format: date-time
        description: Timestamp in RFC 3339 format.
      current_payout:
        type: string
        description: Current cash-out value as a JSON string with two fractional digits.
      grid:
        items:
          $ref: '#/definitions/model.MineTileDto'
        type: array
      id:
        type: string
        description: Identifier of the associated resource.
      multiplier:
        example: '1.030000'
        type: string
        description: Current payout multiplier as a JSON string with six fractional digits.
      revealed_count:
        type: integer
      risk_level:
        type: string
      status:
        type: string
        description: Current game lifecycle state.
      user_id:
        type: string
        description: Identifier of the associated resource.
    type: object
    description: MineGameDto representation used by this API.
  model.MineGameHistoryDto:
    properties:
      bet_amount:
        type: string
        description: Exact-decimal amount represented as a JSON string with two fractional digits in responses.
      completed_at:
        type: string
      created_at:
        type: string
        format: date-time
        description: Timestamp in RFC 3339 format.
      final_payout:
        type: string
        description: Exact-decimal amount represented as a JSON string with two fractional digits in responses.
      game_id:
        type: string
        description: Identifier of the associated resource.
      multiplier:
        example: '1.030000'
        type: string
        description: Exact-decimal rate represented as a JSON string with six fractional digits in responses.
      revealed_count:
        type: integer
      risk_level:
        type: string
      status:
        type: string
    type: object
  model.MineGameStatsDto:
    properties:
      active_current_payout:
        type: string
        description: Exact-decimal amount represented as a JSON string with two fractional digits in responses.
      active_wagered:
        type: string
        description: Exact-decimal amount represented as a JSON string with two fractional digits in responses.
      games_cashed_out:
        type: integer
      games_lost:
        type: integer
      games_won:
        type: integer
      net_profit:
        type: string
        description: Net result as a signed JSON string with two fractional digits.
      total_games:
        type: integer
      total_wagered:
        type: string
        description: Lifetime wager total as a JSON string with two fractional digits.
      total_winnings:
        type: string
        description: Lifetime winnings as a JSON string with two fractional digits.
      win_rate:
        description: Percentage of completed games won.
        example: 33.333333
        type: number
    type: object
    description: MineGameStatsDto representation used by this API.
  model.MineTileDto:
    properties:
      index:
        type: integer
      revealed:
        type: boolean
      type:
        description: diamond, bomb, hidden
        type: string
    type: object
  model.RevealMineTileRequest:
    properties:
      index:
        maximum: 15
        minimum: 0
        type: integer
        description: Zero-based tile index from 0 through 15. Zero is a valid value.
    required:
    - index
    type: object
  model.ScoreDto:
    properties:
      team_a_score:
        minimum: 0
        type: integer
      team_b_score:
        minimum: 0
        type: integer
    required:
    - team_a_score
    - team_b_score
    type: object
  model.SetDailyRewardRequest:
    properties:
      amount:
        type: string
        description: Nonnegative reward as a decimal JSON string; numeric JSON tokens are rejected.
    required:
    - amount
    type: object
  model.LocationDto:
    properties:
      id:
        type: string
        example: CIVIL_COURT
        description: Stable identifier referenced by matches. IDs use 1–100 ASCII letters, digits, underscores, or hyphens.
      title:
        type: string
        example: สนามโยธา
        description: Current display name. Titles are trimmed to 1–100 characters and are not required to be unique.
    required:
    - id
    - title
    type: object
    description: A configured venue available for match scheduling.
  model.CreateLocationRequest:
    properties:
      id:
        type: string
        example: NEW_COURT
        minLength: 1
        maxLength: 100
        pattern: ^[A-Za-z0-9_-]+$
        description: Stable identifier; use 1–100 ASCII letters, digits, underscores, or hyphens.
      title:
        type: string
        example: New Court
        minLength: 1
        maxLength: 100
        description: Display name, trimmed to 1–100 characters. Duplicate titles are allowed.
    required:
    - id
    - title
    type: object
    description: Fields required to add a location to the catalogue.
  model.UpdateLocationRequest:
    properties:
      title:
        type: string
        example: Updated Court Name
        minLength: 1
        maxLength: 100
        description: New display name, trimmed to 1–100 characters. The location ID cannot be changed.
    required:
    - title
    type: object
    description: Rename an existing location without changing its stable ID.
  model.SportTypeDto:
    properties:
      id:
        type: string
        description: Stable identifier used by matches and clients; titles may change.
      title:
        type: string
        description: Display title. Titles are not unique.
    type: object
    description: SportTypeDto representation used by this API.
  model.StealTokenDto:
    properties:
      expires_at:
        type: string
        format: date-time
        description: Timestamp in RFC 3339 format.
      message:
        type: string
      token:
        type: string
      victim_count:
        type: integer
    type: object
  model.UpdateMatchRequest:
    properties:
      end_time:
        type: string
        description: Optional RFC 3339 timestamp.
      location_id:
        type: string
        example: INDOOR_STADIUM_1
        description: Optional ID of an existing location. Omit the field to keep the current venue; an empty value is rejected.
      start_time:
        type: string
        description: Optional RFC 3339 timestamp.
      team_a:
        type: string
        description: Optional ID of the first team.
      team_b:
        type: string
        description: Optional ID of the second team.
      type:
        type: string
        description: Optional stable sport-type ID.
    type: object
    description: Partial match update; include at least one supported field.
  model.UpdateSportTypeRequest:
    properties:
      title:
        example: Badminton (all years)
        maxLength: 100
        minLength: 1
        type: string
        description: Trimmed display title, 1–100 characters; duplicate titles are allowed.
    required:
    - title
    type: object
    description: UpdateSportTypeRequest representation used by this API.
  model.UseStealTokenRequestDto:
    properties:
      token:
        type: string
      victim_index:
        minimum: 0
        type: integer
    required:
    - token
    - victim_index
    type: object
  model.UseStealTokenResponseDto:
    properties:
      all_candidates:
        items:
          $ref: '#/definitions/model.VictimDetailDto'
        type: array
      message:
        type: string
      raider_new_balance:
        type: string
        description: Exact-decimal amount represented as a JSON string with two fractional digits in responses.
      total_stolen:
        type: string
        description: Exact-decimal amount represented as a JSON string with two fractional digits in responses.
    type: object
  model.UserDto:
    properties:
      created_at:
        type: string
        format: date-time
        description: Timestamp in RFC 3339 format.
      email:
        type: string
      group_id:
        type: string
        description: Current group ID; null when unassigned. A game must validate this ID against its
          own playable groups.
        x-nullable: true
      id:
        type: string
        description: Identifier of the associated resource.
      name:
        type: string
      nick_name:
        type: string
        x-nullable: true
        description: Optional nickname; null when unset.
      remaining_coin:
        example: '888.88'
        type: string
        description: Account balance as a JSON string with two fractional digits.
      role_id:
        type: string
        description: Identifier of the associated resource.
    type: object
    description: UserDto representation used by this API.
  model.VictimDetailDto:
    properties:
      amount_stolen:
        type: string
        description: Exact-decimal amount represented as a JSON string with two fractional digits in responses.
      balance_before:
        type: string
        description: Exact-decimal amount represented as a JSON string with two fractional digits in responses.
      group_id:
        type: string
        description: Identifier of the associated resource.
      index:
        type: integer
      name:
        type: string
      role_id:
        type: string
        description: Identifier of the associated resource.
      user_id:
        type: string
        description: Identifier of the associated resource.
      was_chosen:
        type: boolean
    type: object
  model.VoidBillRequest:
    properties:
      reason:
        type: string
    required:
    - reason
    type: object
  policy.AccessPolicy:
    properties:
      created_at:
        type: string
        format: date-time
        description: Timestamp in RFC 3339 format.
      enabled:
        type: boolean
        description: Whether this policy currently participates in account access checks.
      expires_at:
        type: string
        description: Optional expiration timestamp in RFC 3339 format.
      id:
        type: string
        description: Identifier of the associated resource.
      kind:
        type: string
        description: 'Policy effect: allowlist or blacklist.'
      principal:
        type: string
        description: Normalized email address or domain matched by the policy.
      principal_type:
        type: string
        description: Principal category, such as email or domain.
      reason:
        type: string
      updated_at:
        type: string
        format: date-time
        description: Timestamp in RFC 3339 format.
    type: object
    description: AccessPolicy representation used by this API.
  policy.CreatePolicyRequest:
    properties:
      expires_at:
        type: string
        format: date-time
        description: Timestamp in RFC 3339 format.
      kind:
        enum:
        - allowlist
        - blacklist
        type: string
        description: 'Policy effect: allowlist or blacklist.'
      principal:
        type: string
        description: Email address or Google subject value matched by the policy.
      principal_type:
        enum:
        - email
        - google_subject
        type: string
        description: 'Identity category: email or google_subject.'
      reason:
        type: string
    required:
    - kind
    - principal
    - principal_type
    - reason
    type: object
  policy.PolicyListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/policy.AccessPolicy'
        type: array
      next_cursor:
        type: string
        description: Opaque cursor for the next page; absent when there are no more results.
    type: object
    description: PolicyListResponse representation used by this API.
  policy.UpdatePolicyRequest:
    properties:
      enabled:
        type: boolean
        description: Optional enabled state; false disables the rule without deleting its audit history.
      expires_at:
        type: string
        format: date-time
        description: Optional RFC 3339 timestamp. Send null to remove the expiry.
      reason:
        type: string
    type: object
  stakemine.CashOutResponse:
    properties:
      game:
        $ref: '#/definitions/model.MineGameDto'
      message:
        type: string
    type: object
  stakemine.HistoryListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.MineGameHistoryDto'
        type: array
      limit:
        type: integer
      offset:
        type: integer
    type: object
  stakemine.RevealTileResponse:
    properties:
      game:
        $ref: '#/definitions/model.MineGameDto'
      message:
        type: string
    type: object
  user.UpdateOwnProfileRequest:
    properties:
      group_id:
        type: string
        x-nullable: true
        description: Optional group ID; null clears the current group.
      name:
        type: string
        description: Optional display name.
      nick_name:
        type: string
        x-nullable: true
        description: Optional nickname; null clears the current nickname.
    type: object
    description: UpdateOwnProfileRequest representation used by this API.
  auth.ExternalMeResponse:
    type: object
    required:
    - profile
    properties:
      profile:
        $ref: '#/definitions/model.UserDto'
    description: Authenticated delegated profile. Does not include a browser CSRF token.
  user.DeductCoinRequest:
    type: object
    required:
    - amount
    additionalProperties: false
    properties:
      amount:
        type: string
        example: '25.00'
        description: Coin amount as an exact decimal JSON string with at most two fractional digits; numeric
          JSON tokens and negative values are rejected.
  user.DeductCoinResponse:
    type: object
    required:
    - success
    - deducted_amount
    - remaining_balance
    properties:
      success:
        type: boolean
        example: true
      deducted_amount:
        type: string
        example: '25.00'
        description: Deduction as a two-decimal money string.
      remaining_balance:
        type: string
        example: '863.88'
        description: Balance after deduction as a two-decimal money string.
host: localhost:8080
info:
  title: Intania 888 API
  version: 1.0.0-breaking
  description: 'Intania 888 browser and delegated backend API under /api/v1. Browser login navigates
    to /auth/login with a registered client_id and safe relative return_to. Google returns to the 888
    callback. Protected browser operations use the HttpOnly session cookie; /auth/me returns profile
    and csrf_token. Active-session mutations require X-CSRF-Token and an allowed Origin. Registered
    backends use /auth/authorize with S256 PKCE, exchange one-use codes at /auth/token with HTTP Basic
    client authentication, and keep access and refresh credentials server-side. External resources require
    scoped delegated Bearer credentials.


    Money uses decimal JSON strings (two fractional digits in responses); rates use six-decimal strings.
    Numeric JSON tokens are rejected for exact decimals. Resource failures use code, message, request_id,
    and optional details. Token/revocation protocol failures instead use error; validated browser failures
    redirect, and untrusted destinations receive a local HTML error. Every response includes X-Request-ID.
    The API-wide per-IP limit is 200 requests per minute; its 429 uses the shared resource error envelope.'
paths:
  /auth/revoke:
    post:
      summary: Revoke a client-owned delegation
      description: Server-to-server client_secret_basic. Accepts a refresh or valid access credential.
        Unknown, already revoked, and other-client credentials return success without revealing ownership.
      tags:
      - Auth
      security:
      - OAuthClient: []
      responses:
        '200':
          description: Revocation accepted; plain-text OK. Unknown, expired, already-revoked, or other-client
            credentials do not reveal ownership.
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              type: string
          schema:
            type: string
            example: OK
        '400':
          description: invalid_request.
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              type: string
          schema:
            type: object
            properties:
              error:
                type: string
        '401':
          description: invalid_client.
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              type: string
            WWW-Authenticate:
              type: string
              description: Basic client authentication challenge.
          schema:
            type: object
            properties:
              error:
                type: string
        '503':
          description: temporarily_unavailable.
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              type: string
          schema:
            type: object
            properties:
              error:
                type: string
        '429':
          description: 'TOO_MANY_REQUESTS: API-wide per-IP limit; this response uses the shared resource
            error envelope.'
          headers:
            X-Request-ID:
              type: string
              description: Correlation ID for this request.
          schema:
            $ref: '#/definitions/apierror.Response'
      consumes:
      - application/x-www-form-urlencoded
      parameters:
      - in: formData
        name: token
        type: string
        required: false
        description: Opaque refresh credential or delegated access token to revoke. Unknown or other-client
          credentials also return success.
      produces:
      - application/json
      - text/plain
  /auth/token:
    post:
      summary: Exchange a code or rotate a refresh credential
      description: Server-to-server endpoint authenticated with client_secret_basic. Browser cookies and
        CSRF are not used. Codes are one-use and bound to client, callback and PKCE. Refresh reuse revokes
        the entire delegation.
      tags:
      - Auth
      security:
