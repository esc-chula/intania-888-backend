  /external/deduct-coin:
    post:
      tags:
      - External
      summary: Deduct coins from the delegated account
      description: Requires coins.spend. Strict JSON amount uses the money-string contract; no user_id
        is accepted. Locks the authenticated account and checks its balance in one 888 database transaction.
        No idempotency key, reservation, refund, or cross-database rollback contract exists; do not blindly
        retry an ambiguous response.
