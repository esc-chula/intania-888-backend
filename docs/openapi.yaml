        principal:
          description: Email address or Google subject value matched by the policy.
          type: string
        principal_type:
          description: 'Identity category: email or google_subject.'
          enum:
          - email
          - google_subject
          type: string
        reason:
          type: string
      required:
      - kind
      - principal
      - principal_type
      - reason
      type: object
    policy.PolicyListResponse:
      description: PolicyListResponse representation used by this API.
      properties:
        items:
          nullable: true
          items:
            $ref: '#/components/schemas/policy.AccessPolicy'
          type: array
        next_cursor:
          nullable: true
          description: Opaque cursor for the next page; absent when there are no more results.
          type: string
      required:
      - items
      - next_cursor
      type: object
    policy.UpdatePolicyRequest:
      properties:
        enabled:
          nullable: true
          description: Optional enabled state; false disables the rule without deleting its audit history.
          type: boolean
        expires_at:
          nullable: true
          description: Optional RFC 3339 timestamp. Send null to remove the expiry.
          format: date-time
          type: string
        reason:
          nullable: true
          type: string
      type: object
    stakemine.CashOutResponse:
      properties:
        game:
          $ref: '#/components/schemas/model.MineGameDto'
        message:
          type: string
      required:
      - game
      - message
      type: object
    stakemine.HistoryListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/model.MineGameHistoryDto'
          type: array
        limit:
          type: integer
        offset:
          type: integer
      required:
      - data
      - limit
      - offset
      type: object
    stakemine.RevealTileResponse:
      properties:
        game:
          $ref: '#/components/schemas/model.MineGameDto'
        message:
          type: string
      required:
      - game
      - message
      type: object
    user.UpdateOwnProfileRequest:
      additionalProperties: false
      description: UpdateOwnProfileRequest representation used by this API.
      properties:
        name:
          description: Optional display name.
          type: string
        nick_name:
          description: Optional nickname; null clears the current nickname.
          nullable: true
          type: string
      type: object
    auth.ExternalMeResponse:
      type: object
      required:
      - profile
      properties:
        profile:
          $ref: '#/components/schemas/model.UserDto'
      description: Authenticated delegated profile. Does not include a browser CSRF token.
    user.DeductCoinRequest:
      type: object
      required:
      - amount
      additionalProperties: false
      properties:
        amount:
          type: string
          example: '25.00'
          description: Coin amount as an exact decimal JSON string with at most two fractional digits; numeric JSON
            tokens and negative values are rejected.
    user.DeductCoinResponse:
      type: object
      required:
      - success
      - deducted_amount
      - remaining_balance
      properties:
        success:
          type: boolean
          example: true
        deducted_amount:
          type: string
          example: '25.00'
          description: Deduction as a two-decimal money string.
        remaining_balance:
          type: string
          example: '863.88'
          description: Balance after deduction as a two-decimal money string.
  securitySchemes:
    OAuthClient:
      type: http
      scheme: basic
      description: Backend client ID and secret; never supply from frontend JavaScript.
    BearerAuth:
      type: http
      scheme: bearer
      description: Delegated access token issued to a registered backend. Enter Bearer followed by the access token.
        /external/me requires profile.read; /external/deduct-coin requires coins.spend. Cookies and unscoped credentials
        are not accepted.
    CookieSession:
      description: Development browser session cookie named session. The browser sends this HttpOnly cookie automatically.
        Do not paste a cookie into Swagger's Authorize dialog. Swagger reads the CSRF token from GET /auth/me and
        attaches it to browser mutations.
      in: cookie
      name: session
      type: apiKey
    SecureCookieSession:
      description: Production browser session cookie named __Host-session. The browser sends this HttpOnly cookie
        automatically. Do not paste a cookie into Swagger's Authorize dialog. Swagger reads the CSRF token from
        GET /auth/me and attaches it to browser mutations.
      in: cookie
      name: __Host-session
      type: apiKey
