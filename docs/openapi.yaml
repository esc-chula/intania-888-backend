              refresh_token:
                type: string
              token_type:
                type: string
              expires_in:
                type: integer
              scope:
                type: string
              user_id:
                type: string
        '400':
          description: invalid_request, invalid_grant or unsupported_grant_type.
          headers:
            X-Request-ID:
