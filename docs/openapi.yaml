openapi: 3.0.3
info:
  description: "Browser and application API for Intania 888. All application routes use the /api/v1 base path. Browser\
    \ authentication uses an HttpOnly session cookie; call GET /auth/me after login to retrieve the current profile\
    \ and session-bound csrf_token. Send that token in X-CSRF-Token with browser mutations while a session is active\
    \ and send an Origin allowed by the server. Mutations are rejected when either check fails. \n\nMoney values\
    \ are JSON strings. Responses use exactly two fractional digits; requests accept up to two. Rate values are\
    \ JSON strings with up to six fractional digits in requests and six in responses. Numeric JSON tokens are not\
    \ accepted for these decimal values. \n\nAPI failures use the shared apierror.Response shape: code, message,\
    \ request_id, and optional field-level details. The same request ID is returned in the X-Request-ID header.\
    \ Dates and timestamps use the formats documented by each field. The /external/* backend integration\
    \ requires scoped Bearer credentials.\n\nEvery API request reaching the limiter shares a provisional\
    \ 60,000-request/minute/IP guard (burst 2,000). Protected browser routes also allow 300/minute/account (burst 20).\
    \ External routes share 10,000/minute/signed client ID (burst 300). /external/me allows 60/minute/user (burst 5),\
    \ and /external/deduct-coin allows 10/minute/user (burst 3), across clients. Login and authorization initiation\
    \ share 1,200/minute/IP (burst 100); callbacks have an independent 1,200/minute/IP budget (burst 100).\
    \ Token exchange and revocation each allow 2,000/minute/authenticated client (burst 200). Invalid Basic\
    \ credentials share 30/minute/IP (burst 5); invalid external credentials or rejected grants allow 120/minute/IP\
    \ (burst 10). Valid credentials bypass the corresponding failure budget. Each burst bucket refills\
    \ continuously at its configured minute rate divided by 60. Minute values are sustained refill rates, not window counts. All budgets are configurable and per API process.\
    \ Exceeding an applicable budget returns 429 TOO_MANY_REQUESTS with positive Retry-After seconds."
  title: Intania 888 API
  version: 1.0.0-breaking
servers:
- url: http://localhost:8080/api/v1
paths:
  /auth/callback:
    get:
      operationId: completeGoogleAuthentication
      summary: Complete Google authentication and resume the application flow
      description: Checks the transaction-specific browser binding and consumes Google state once. Sets the opaque
        888 session and redirects to the cookie frontend or registered application callback with a one-use code. Validated
        failures use the recorded application destination.
      tags:
      - Auth
      parameters:
      - name: state
        in: query
        description: One-use provider transaction state.
        required: true
        schema:
          type: string
      - name: code
        in: query
        description: Google authorization code, absent on provider denial.
        required: false
        schema:
          type: string
      - name: error
        in: query
        description: Google error on provider denial.
        required: false
        schema:
          type: string
      responses:
        '303':
          description: Application continuation or trusted error redirect.
          headers: &id001_1
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Missing, expired, replayed or unbound transaction.
          headers: *id001_1
          content:
            text/html:
              schema:
                type: string
        '503':
          description: Login storage unavailable.
          headers: *id001_1
          content:
            text/html:
              schema:
                type: string
        '429':
          description: 'TOO_MANY_REQUESTS: the callback or shared-IP minute/burst budget was exceeded.'
          headers:
            Retry-After:
              description: Positive retry delay in seconds, rounded upward; continued traffic can exhaust the budget again.
              schema:
                type: integer
                minimum: 1
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
  /auth/authorize:
    get:
      operationId: authorizeApplication
      summary: Authorize a registered backend application
      description: Uses the 888 browser session or Google login. Requires an exact registered redirect_uri, response_type=code,
        client state, allowed scopes, and S256 PKCE. Only operator-registered first-party clients are supported.
      tags:
      - Auth
      parameters:
      - name: client_id
        in: query
        description: Registered backend application ID.
        required: true
        schema:
          type: string
      - name: redirect_uri
        in: query
        description: Exact registered backend callback.
        required: true
        schema:
          type: string
      - name: response_type
        in: query
        description: Must be code.
        required: true
        schema:
          type: string
      - name: state
        in: query
        description: Client browser-bound state.
        required: true
        schema:
          type: string
      - name: scope
        in: query
        description: Space-separated requested permissions.
        required: true
        schema:
          type: string
      - name: code_challenge
        in: query
        description: S256 PKCE challenge.
        required: true
        schema:
          type: string
      - name: code_challenge_method
        in: query
        description: Must be S256.
        required: true
        schema:
          type: string
      responses:
        '303':
          description: Google login or registered callback with code/state or error/state.
          headers: &id001_2
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Invalid client or callback; no redirect.
          headers: *id001_2
          content:
            text/html:
              schema:
                type: string
        '429':
          description: Initiation/shared-IP minute or burst budget exceeded (resource JSON), or pending login transaction limit reached (local HTML).
          headers:
            Retry-After:
              description: Positive retry delay for a request-budget rejection, in seconds.
              schema:
                type: integer
                minimum: 1
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
            text/html:
              schema:
                type: string
        '503':
          description: Login storage unavailable.
          headers: *id001_2
          content:
            text/html:
              schema:
                type: string
  /auth/token:
    post:
      operationId: exchangeApplicationToken
      summary: Exchange a code or rotate a refresh credential
      description: Server-to-server endpoint authenticated with client_secret_basic. Browser cookies and CSRF are
        not used. Codes are one-use and bound to client, callback and PKCE. Refresh reuse revokes the entire delegation.
      tags:
      - Auth
      security:
      - OAuthClient: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - grant_type
              properties:
                grant_type:
                  type: string
                code:
                  type: string
                redirect_uri:
                  type: string
                code_verifier:
                  type: string
                refresh_token:
                  type: string
      responses:
        '200':
          description: Bearer access_token, rotating refresh_token, token_type, expires_in, scope and user_id.
          headers: *id001_2
          content:
            application/json:
              schema:
                type: object
                required:
                - access_token
                - refresh_token
                - token_type
                - expires_in
                - scope
                - user_id
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  scope:
                    type: string
                  user_id:
                    type: string
        '400':
          description: invalid_request, invalid_grant or unsupported_grant_type.
          headers: *id001_2
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '401':
          description: invalid_client.
          headers: *id001_2
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '503':
          description: temporarily_unavailable.
          headers: *id001_2
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '429':
          description: 'TOO_MANY_REQUESTS: an application, invalid-client, shared-IP, or burst budget was exceeded; uses the resource error envelope.'
          headers:
            Retry-After:
              description: Positive retry delay in seconds, rounded upward; continued traffic can exhaust the budget again.
              schema:
                type: integer
                minimum: 1
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
  /auth/revoke:
    post:
      operationId: revokeApplicationToken
      summary: Revoke a client-owned delegation
      description: Server-to-server client_secret_basic. Accepts a refresh or valid access credential. Unknown, already
        revoked, and other-client credentials return success without revealing ownership.
      tags:
      - Auth
      security:
      - OAuthClient: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Optional opaque refresh credential or delegated access token to revoke.
      responses:
        '200':
          description: Revocation completed or credential unknown; plain-text OK.
          headers: *id001_2
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '400':
          description: invalid_request.
          headers: *id001_2
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '401':
          description: invalid_client.
          headers: *id001_2
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '503':
          description: temporarily_unavailable.
          headers: *id001_2
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '429':
          description: 'TOO_MANY_REQUESTS: an application, invalid-client, shared-IP, or burst budget was exceeded; uses the resource error envelope.'
          headers:
            Retry-After:
              description: Positive retry delay in seconds, rounded upward; continued traffic can exhaust the budget again.
              schema:
                type: integer
                minimum: 1
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
  /auth/login:
    get:
      operationId: startBrowserLogin
      summary: Start registered cookie application login
      description: Browser navigation. Requires client_id. Reuses a valid 888 session or starts Google login with
        an independent transaction cookie. return_to is a validated relative frontend path. New accounts go to configured
        onboarding.
      tags:
      - Auth
      parameters:
      - name: client_id
        in: query
        description: Registered cookie application ID.
        required: true
        schema:
          type: string
      - name: return_to
        in: query
        description: Relative frontend path; defaults to the registered path.
        required: false
        schema:
          type: string
      responses:
        '303':
          description: Google or application redirect.
          headers: &id001_3
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Invalid application or return path.
          headers: *id001_3
          content:
            text/html:
              schema:
                type: string
        '429':
          description: Initiation/shared-IP minute or burst budget exceeded (resource JSON), or pending login transaction limit reached (local HTML).
          headers:
            Retry-After:
              description: Positive retry delay for a request-budget rejection, in seconds.
              schema:
                type: integer
                minimum: 1
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
            text/html:
              schema:
                type: string
        '503':
          description: Login storage unavailable.
          headers: *id001_3
          content:
            text/html:
              schema:
                type: string
  /auth/logout:
    post:
      operationId: logoutBrowserSession
      description: Revokes the active server-side browser session and expires its cookie. If there is no active
        session, logout succeeds idempotently. When a session is active, send the session-bound X-CSRF-Token from
        GET /auth/me.
      parameters:
      - description: Session-bound token returned by GET /auth/me. Required when a session is active; logout succeeds
          without a session.
        in: header
        name: X-CSRF-Token
        schema:
          type: string
      responses:
        '204':
          description: logged out
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: 'invalid CSRF token Failure body follows apierror.Response; code is stable, message is safe
            to display, and request_id matches the X-Request-ID response header. Failure body follows apierror.Response:
            stable code, safe message, request_id, and optional field details.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: An applicable shared-IP, account, authentication, or burst budget was exceeded.
          headers:
            Retry-After:
              description: Positive retry delay in seconds, rounded upward; continued traffic can exhaust the budget again.
              schema:
                type: integer
                minimum: 1
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: 'session store or revocation unavailable Failure body follows apierror.Response; code is
            stable, message is safe to display, and request_id matches the X-Request-ID response header. Failure
            body follows apierror.Response: stable code, safe message, request_id, and optional field details.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
      security:
      - CookieSession: []
      - SecureCookieSession: []
      summary: Log out of browser session
      tags:
      - Auth
  /auth/me:
    get:
      operationId: getBrowserSession
      description: Returns the profile for the current browser session and a session-bound csrf_token. Keep the
        token in memory and send it in X-CSRF-Token on browser mutations; do not persist it in local storage.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.MeResponse'
          description: OK
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: 'unauthorized Failure body follows apierror.Response; code is stable, message is safe to
            display, and request_id matches the X-Request-ID response header. Failure body follows apierror.Response:
            stable code, safe message, request_id, and optional field details.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: An applicable shared-IP, account, authentication, or burst budget was exceeded.
          headers:
            Retry-After:
              description: Positive retry delay in seconds, rounded upward; continued traffic can exhaust the budget again.
              schema:
                type: integer
                minimum: 1
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: 'session or policy unavailable Failure body follows apierror.Response; code is stable, message
            is safe to display, and request_id matches the X-Request-ID response header. Failure body follows apierror.Response:
            stable code, safe message, request_id, and optional field details.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
      security:
      - CookieSession: []
      - SecureCookieSession: []
      summary: Browser profile and CSRF token
      tags:
      - Auth
  /auth/policies:
    get:
      operationId: listAccessPolicies
      description: Administrator-only. Lists access policies. Optional filters select kind, identity category, and
        active/inactive/all state. Pages contain up to 200 records and use an opaque next_cursor.
      parameters:
      - description: 'Optional policy effect filter: allowlist or blacklist.'
        in: query
        name: kind
        schema:
          enum:
          - allowlist
          - blacklist
          type: string
      - description: Optional identity category filter.
        in: query
        name: principal_type
        schema:
          enum:
          - email
          - google_subject
          type: string
      - description: Policy state filter. Defaults to active; inactive includes disabled or expired records.
        in: query
        name: status
        schema:
          default: active
          enum:
          - active
          - inactive
          - all
          type: string
      - description: Page size from 1 through 200; defaults to 50.
        in: query
        name: limit
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
      - description: Opaque URL-safe cursor from next_cursor in the previous response; omit for the first page.
        in: query
        name: cursor
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/policy.PolicyListResponse'
          description: OK
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: 'Bad Request Failure body follows apierror.Response; code is stable, message is safe to display,
            and request_id matches the X-Request-ID response header. Failure body follows apierror.Response: stable
            code, safe message, request_id, and optional field details.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: 'Unauthorized Failure body follows apierror.Response; code is stable, message is safe to
            display, and request_id matches the X-Request-ID response header. Failure body follows apierror.Response:
            stable code, safe message, request_id, and optional field details.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: 'Forbidden Failure body follows apierror.Response; code is stable, message is safe to display,
            and request_id matches the X-Request-ID response header. Failure body follows apierror.Response: stable
            code, safe message, request_id, and optional field details.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: An applicable shared-IP, account, authentication, or burst budget was exceeded.
          headers:
            Retry-After:
              description: Positive retry delay in seconds, rounded upward; continued traffic can exhaust the budget again.
              schema:
                type: integer
                minimum: 1
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: 'Internal Server Error Failure body follows apierror.Response; code is stable, message is
            safe to display, and request_id matches the X-Request-ID response header. Failure body follows apierror.Response:
            stable code, safe message, request_id, and optional field details.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: 'Session or access-policy state could not be checked because a required dependency is unavailable.
            Failure body follows apierror.Response: stable code, safe message, request_id, and optional field details.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
      security:
      - CookieSession: []
      - SecureCookieSession: []
      summary: List access policies
      tags:
      - Auth Policy
    post:
      operationId: createAccessPolicy
      description: Administrator-only. Creates an allowlist or blacklist policy for an email address or Google subject.
        The identity is normalized by the server; duplicate active policy identities conflict.
      parameters:
      - description: Session-bound token returned by GET /auth/me. Required for browser mutations.
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/policy.CreatePolicyRequest'
        description: access policy
        required: true
        x-originalParamName: policy
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/policy.AccessPolicy'
          description: Created
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: 'Bad Request Failure body follows apierror.Response; code is stable, message is safe to display,
            and request_id matches the X-Request-ID response header. Failure body follows apierror.Response: stable
            code, safe message, request_id, and optional field details.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: 'Unauthorized Failure body follows apierror.Response; code is stable, message is safe to
            display, and request_id matches the X-Request-ID response header. Failure body follows apierror.Response:
            stable code, safe message, request_id, and optional field details.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: 'Forbidden Failure body follows apierror.Response; code is stable, message is safe to display,
            and request_id matches the X-Request-ID response header. Failure body follows apierror.Response: stable
            code, safe message, request_id, and optional field details.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: 'Conflict Failure body follows apierror.Response; code is stable, message is safe to display,
            and request_id matches the X-Request-ID response header. Failure body follows apierror.Response: stable
            code, safe message, request_id, and optional field details.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: An applicable shared-IP, account, authentication, or burst budget was exceeded.
          headers:
            Retry-After:
              description: Positive retry delay in seconds, rounded upward; continued traffic can exhaust the budget again.
              schema:
                type: integer
                minimum: 1
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
          description: 'Internal Server Error Failure body follows apierror.Response; code is stable, message is
            safe to display, and request_id matches the X-Request-ID response header. Failure body follows apierror.Response:
            stable code, safe message, request_id, and optional field details.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request. The same value appears in apierror.Response.request_id.
              schema:
                type: string
        '503':
          content:
            application/json:
              schema:
