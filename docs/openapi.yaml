        - refresh_token
      - in: formData
        name: code
        type: string
        required: false
        description: One-use code required for authorization_code; expires according to registry lifetime.
      - in: formData
        name: redirect_uri
        type: string
        required: false
        description: Exact callback used during authorization; required for authorization_code.
      - in: formData
        name: code_verifier
        type: string
        required: false
        description: Original 43–128 character PKCE verifier; required for authorization_code.
