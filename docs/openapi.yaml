securityDefinitions:
  OAuthClient:
    type: basic
    description: Confidential backend client authentication (client_secret_basic). Form-url-encode the
      client ID and secret individually before joining with a colon and Base64 encoding. Cookies and
      CSRF do not authenticate token or revocation requests.
  CookieSession:
    description: Browser session cookie. The cookie is HttpOnly and is normally sent by the browser
      automatically. Production uses the __Host-session cookie name. Swagger 2.0 represents this as
      a Cookie header. For browser mutations, also send X-CSRF-Token from GET /auth/me and an allowed
      Origin.
    in: header
    name: Cookie
    type: apiKey
  BearerAuth:
    type: apiKey
    in: header
    name: Authorization
    description: Delegated access token issued to a registered backend. Enter Bearer followed by the
      access token. /external/me requires profile.read; /external/deduct-coin requires coins.spend.
      Cookies and unscoped credentials are not accepted.
swagger: '2.0'
consumes:
- application/json
produces:
- application/json
tags:
- name: Auth
  description: Registered application login, browser sessions, scoped backend delegation, and revocation.
- name: Auth Policy
  description: Administrator-managed allowlist and blacklist rules for account access.
- name: Bill
  description: Browser bill placement, lookup, and administrator void/refund actions.
- name: Color
  description: Public color standings and group-stage results derived from completed matches.
- name: Event
  description: Daily rewards, slot-machine spins, and steal-token actions.
- name: Location
  description: Public location catalogue reads and administrator-managed venue changes.
- name: Match
  description: Public fixture schedules and server time, plus administrator match updates, outcomes, and settlement.
- name: StakeMines
  description: Stake Mines game lifecycle, history, and player statistics.
- name: SportType
  description: Public sport catalogue reads and administrator catalogue changes.
- name: User
  description: Authenticated profile reads and self-service or administrator profile updates.
- name: External
  description: Scoped delegated profile reads and account coin spending by registered backends.
