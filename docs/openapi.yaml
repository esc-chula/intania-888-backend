        name: refresh_token
        type: string
        required: false
        description: Current opaque refresh credential; required for refresh_token.
      produces:
      - application/json
  /auth/authorize:
    get:
      summary: Authorize a registered backend application
      description: Uses the 888 browser session or Google login. Requires an exact registered redirect_uri,
        response_type=code, client state, allowed scopes, and S256 PKCE. Only operator-registered first-party
        clients are supported.
      tags:
      - Auth
      parameters:
      - name: client_id
        in: query
        description: Registered backend application ID.
        required: true
        type: string
      - name: redirect_uri
        in: query
        description: Exact registered backend callback.
        required: true
        type: string
      - name: response_type
        in: query
        description: Must be code.
        required: true
        type: string
        enum:
        - code
      - name: state
        in: query
        description: Client browser-bound state.
        required: true
        type: string
        minLength: 1
        maxLength: 512
      - name: scope
        in: query
        description: Space-separated requested permissions.
        required: true
        type: string
      - name: code_challenge
        in: query
        description: S256 PKCE challenge.
        required: true
        type: string
      - name: code_challenge_method
        in: query
        description: Must be S256.
        required: true
        type: string
        enum:
        - S256
      responses:
        '303':
          description: Google login or registered callback with code/state or error/state.
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              type: string
            Location:
              type: string
              description: Validated Google, registered frontend, or registered backend callback destination.
        '400':
          description: Invalid client or callback; no redirect. Local HTML error; not the resource JSON
            envelope.
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              type: string
          schema:
            type: string
        '429':
          description: 'TOO_MANY_REQUESTS: global per-IP limit. Pending-login limit instead returns a
            local HTML sign-in error with status 429.'
          headers:
            X-Request-ID:
              type: string
              description: Correlation ID for this request.
          schema:
            $ref: '#/definitions/apierror.Response'
        '503':
          description: Login storage unavailable. Local HTML error; not the resource JSON envelope.
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              type: string
          schema:
            type: string
      produces:
      - text/html
      - text/plain
      - application/json
  /auth/callback:
    get:
      summary: Complete Google authentication and resume the application flow
      description: Checks the transaction-specific browser binding and consumes Google state once. Sets
        the opaque 888 session and redirects to the cookie frontend or registered application callback
        with a one-use code. Validated failures use the recorded application destination.
      tags:
      - Auth
      parameters:
      - name: state
        in: query
        description: One-use provider transaction state.
        required: true
        type: string
      - name: code
        in: query
        description: Google authorization code, absent on provider denial.
        required: false
        type: string
      - name: error
        in: query
        description: Google error on provider denial.
        required: false
        type: string
      responses:
        '303':
          description: Application continuation or trusted error redirect.
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              type: string
            Location:
              type: string
              description: Validated Google, registered frontend, or registered backend callback destination.
        '400':
          description: Missing, expired, replayed or unbound transaction. Local HTML error; not the resource
            JSON envelope.
          headers:
            X-Request-ID:
