  /auth/login:
    get:
      summary: Start registered cookie application login
      description: Browser navigation. Requires client_id. Reuses a valid 888 session or starts Google
        login with an independent transaction cookie. return_to is a validated relative frontend path.
        New accounts go to configured onboarding.
      tags:
      - Auth
      parameters:
      - name: client_id
        in: query
        description: Registered cookie application ID.
        required: true
        type: string
      - name: return_to
        in: query
        description: Safe relative path on the registered frontend; defaults to default_return_path. Rejects
          absolute URLs, // authorities, backslashes, fragments and control characters, including encoded
          forms.
        required: false
        type: string
      responses:
        '303':
          description: Google or application redirect.
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              type: string
            Location:
