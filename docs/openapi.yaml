                $ref: '#/components/schemas/apierror.Response'
        '429':
          description: 'TOO_MANY_REQUESTS: a shared-IP, invalid-credential, signed-client, transaction-user, or burst budget was exceeded.'
          headers:
            Retry-After:
              description: Positive retry delay in seconds, rounded upward; continued traffic can exhaust the budget again.
              schema:
                type: integer
                minimum: 1
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
        '500':
          description: 'INTERNAL_ERROR: unexpected resource failure.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
        '503':
          description: 'DEPENDENCY_UNAVAILABLE: credential, user, or policy state cannot be checked.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
        '400':
          description: 'INVALID_REQUEST: invalid JSON, unsupported fields, or invalid money amount.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
        '404':
          description: 'RESOURCE_NOT_FOUND: account disappeared before deduction.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
        '422':
          description: 'INSUFFICIENT_BALANCE: no coins deducted.'
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apierror.Response'
components:
  schemas:
    apierror.Response:
      description: Response representation used by this API.
      example:
        code: INVALID_REQUEST
        details:
          total: must be a decimal string
        message: Invalid request
        request_id: 5ef9fba0-0123-4abc-8123-0123456789ab
      properties:
        code:
          description: Stable machine-readable error code. Clients should branch on this field rather than message
            text.
          type: string
        details:
          additionalProperties:
            type: string
          description: Optional field-level validation details keyed by request field.
          type: object
        message:
          description: Safe human-readable error summary.
          type: string
        request_id:
          description: Server-generated ID for tracing this request; also returned in X-Request-ID.
          type: string
      required:
      - code
      - message
      - request_id
      type: object
    auth.MeResponse:
      properties:
        csrf_token:
          type: string
        profile:
          $ref: '#/components/schemas/model.UserDto'
      required:
      - csrf_token
      - profile
      type: object
    event.SpinResponse:
      properties:
        candidates:
          items:
            $ref: '#/components/schemas/model.CandidatePreviewDto'
          type: array
        reward:
          description: Exact-decimal amount represented as a JSON string with two fractional digits in responses.
          type: string
        slots:
          items:
            type: string
          type: array
        stealToken:
          $ref: '#/components/schemas/model.StealTokenDto'
      required:
      - reward
      - slots
      type: object
    model.AdminUpdateUserDto:
      additionalProperties: false
      properties:
        group_id:
          nullable: true
          description: Group ID to assign; null clears membership; omission leaves membership unchanged.
          type: string
        name:
          type: string
        nick_name:
          nullable: true
          type: string
        remaining_coin:
          description: New account balance as a decimal JSON string; the handler writes 0.00 when this field is
            omitted. Include the intended balance on every update. Numeric JSON tokens are rejected.
          example: '888.88'
          type: string
      required:
      - name
      type: object
    model.BillHeadDto:
      description: BillHeadDto representation used by this API.
      properties:
        id:
          description: Unique bill identifier.
          type: string
        lines:
          description: Selections and server-calculated rates attached to this bill.
          items:
            $ref: '#/components/schemas/model.BillLineDto'
          type: array
        payout:
          nullable: true
          description: Settlement payout as an exact-decimal string; absent until settled.
          type: string
        settled_at:
          nullable: true
          description: Settlement timestamp in RFC 3339 format when settled.
          type: string
        status:
          description: Bill lifecycle state.
          type: string
        total:
          description: Total stake as a JSON string with two fractional digits.
          example: '100.00'
          type: string
        user_id:
          description: Identifier of the associated resource.
          type: string
        voided_at:
          nullable: true
          description: Void timestamp in RFC 3339 format when voided.
          type: string
      required:
      - id
      - lines
      - payout
      - settled_at
      - status
      - total
      - user_id
      - voided_at
      type: object
    model.BillLineDto:
      description: BillLineDto representation used by this API.
      properties:
        betting_on:
          description: Selected side for the associated match.
          type: string
        bill_id:
          description: Identifier of the associated resource.
          type: string
        match:
          $ref: '#/components/schemas/model.MatchDto'
        match_id:
          description: Identifier of the selected match.
          type: string
        rate:
          description: Server-calculated rate as a JSON string with six fractional digits.
          example: '2.000000'
          type: string
      required:
      - betting_on
      - bill_id
      - match
      - match_id
      - rate
      type: object
    model.CandidatePreviewDto:
      properties:
        group_id:
          nullable: true
          description: Identifier of the associated resource.
          type: string
        index:
          type: integer
        name:
          type: string
        role_id:
          description: Identifier of the associated resource.
          type: string
      required:
      - group_id
      - index
      - name
      - role_id
      type: object
    model.ColorDto:
      properties:
        drawn:
          type: integer
        id:
          description: Identifier of the associated resource.
          type: string
        lost:
          type: integer
        title:
          type: string
        total_matches:
          type: integer
        won:
          type: integer
      required:
      - drawn
      - id
      - lost
      - total_matches
      - won
      type: object
    model.ColorCoinRankDto:
      properties:
        id:
          description: Color ID.
          type: string
        rank:
          description: Position starting at 1.
          type: integer
        title:
          type: string
        total_coin:
          description: Team coins earned, as a JSON string with two fractional digits.
          example: '300.00'
          type: string
      required:
      - id
      - rank
      - total_coin
      type: object
    model.ColorPredictionRankDto:
      properties:
        accuracy:
          description: Percentage of decided predictions that were correct, with two decimals; 0 when none are decided.
          type: number
        correct:
          type: integer
        id:
          description: Color ID.
          type: string
        rank:
          description: Position starting at 1.
          type: integer
        title:
          type: string
        total:
          description: correct + wrong.
          type: integer
        wrong:
          type: integer
      required:
      - accuracy
      - correct
      - id
      - rank
      - total
      - wrong
      type: object
    model.CreateBillLineRequest:
      description: CreateBillLineRequest representation used by this API.
      properties:
        betting_on:
          description: 'Selection: team_a or team_b.'
          type: string
        match_id:
          description: Identifier of an existing match accepting bets.
          type: string
      required:
      - betting_on
      - match_id
      type: object
    model.CreateBillRequest:
      description: CreateBillRequest representation used by this API.
      properties:
        lines:
          description: One or more match selections to include in the bill.
          items:
            $ref: '#/components/schemas/model.CreateBillLineRequest'
          minItems: 1
          type: array
        total:
          description: Positive total stake as a decimal string; numeric JSON values are rejected.
          example: '100.00'
          type: string
      required:
      - lines
      - total
      type: object
    model.CreateLocationRequest:
      description: Fields required to add a location to the catalogue.
      properties:
        id:
          description: Stable identifier; use 1–100 ASCII letters, digits, underscores, or hyphens.
          example: NEW_COURT
          maxLength: 100
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        title:
          description: Display name, trimmed to 1–100 characters. Duplicate titles are allowed.
          example: New Court
          maxLength: 100
          minLength: 1
          type: string
      required:
      - id
      - title
      type: object
    model.CreateMatchRequest:
      description: Required fields for creating a scheduled match.
      properties:
        end_time:
          description: RFC 3339 timestamp; must be later than start_time.
          type: string
        location_id:
          description: ID of an existing location returned by GET /locations.
          example: CIVIL_COURT
          type: string
        start_time:
          description: RFC 3339 timestamp; must be earlier than end_time.
          type: string
        team_a:
          description: ID of the first team.
          type: string
        team_b:
          description: ID of the second team; it must differ from team_a.
          type: string
        type:
          description: Stable sport-type ID returned by GET /sport-types.
          type: string
      required:
      - end_time
      - location_id
      - start_time
      - team_a
      - team_b
      - type
      type: object
    model.CreateMineGameRequest:
      properties:
        bet_amount:
          description: Wager as a decimal JSON string. The accepted range is 1.00 through 1000000.00; numeric JSON
            tokens are rejected.
          type: string
        risk_level:
          description: 'Board risk level: low, medium, or high.'
          enum:
          - low
          - medium
          - high
          type: string
      required:
      - bet_amount
      - risk_level
      type: object
    model.CreateSportTypeRequest:
      description: CreateSportTypeRequest representation used by this API.
      properties:
        id:
          description: 1–100 ASCII letters, digits, underscores, or hyphens.
          example: BADMINTON_ALL
          maxLength: 100
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        title:
          description: Trimmed display title, 1–100 characters; duplicate titles are allowed.
          example: Badminton
          maxLength: 100
          minLength: 1
          type: string
      required:
      - id
      - title
      type: object
    model.DailyRewardScheduleItem:
      properties:
        amount:
          description: Exact-decimal amount represented as a JSON string with two fractional digits in responses.
          type: string
        date:
          description: Reward date in DD-MM-YYYY format.
          type: string
      required:
      - amount
      - date
      type: object
    model.DailyRewardScheduleResponse:
      properties:
        default_amount:
          description: Exact-decimal amount represented as a JSON string with two fractional digits in responses.
          type: string
        overrides:
          items:
            $ref: '#/components/schemas/model.DailyRewardScheduleItem'
          type: array
      required:
      - default_amount
      - overrides
      type: object
    model.LocationDto:
      description: A configured venue available for match scheduling.
      properties:
        id:
          description: Stable identifier referenced by matches. IDs use 1–100 ASCII letters, digits, underscores,
            or hyphens.
          example: CIVIL_COURT
          type: string
        title:
          description: Current display name. Titles are trimmed to 1–100 characters and are not required to be unique.
          example: สนามโยธา
          type: string
      required:
      - id
      - title
      type: object
    model.MatchDto:
      description: Match resource included in match responses and nested bill lines, with the assigned location.
      properties:
        end_time:
          description: Match end timestamp in RFC 3339 format.
          type: string
        id:
          description: Unique match identifier.
          type: string
        is_draw:
          description: True when the terminal result is a draw.
          type: boolean
        location:
          $ref: '#/components/schemas/model.LocationDto'
        start_time:
          description: Match start timestamp in RFC 3339 format.
          type: string
        team_a:
          type: string
        team_a_rate:
          description: Current server-calculated rate for team_a, represented with six fractional digits.
          example: '1.750000'
          type: string
        team_a_score:
          nullable: true
          type: integer
        team_b:
          type: string
        team_b_rate:
          description: Current server-calculated rate for team_b, represented with six fractional digits.
          example: '2.500000'
          type: string
        team_b_score:
          nullable: true
          type: integer
        type:
          type: string
        winner:
          description: Winning team ID, or empty when no winner is set.
          type: string
      required:
      - end_time
      - id
      - is_draw
      - location
      - start_time
      - team_a
      - team_a_rate
      - team_a_score
      - team_b
      - team_b_rate
      - team_b_score
      - type
      - winner
      type: object
    model.MatchResultRequest:
      description: Request to set a match to a winner or draw and settle affected bills.
      properties:
        outcome:
          description: Use winner with winner_id to select a winning team, or draw for a tie.
