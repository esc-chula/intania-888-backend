  /colors/leaderboards/coins:
    get:
      operationId: getColorCoinRanking
      description: Returns every color ranked by its team coins, highest first; ties break by color ID. For each decided match, only the color's members who bet on it vote. When more of those bettors picked the winner than the loser, the color earns the fixed per-match award (a tie earns nothing, and the margin does not matter). The total is kept on the color and every change is recorded in an append-only ledger, which is corrected when a bill is voided. Drawn matches award nothing. Colors with no awards total 0.00. No session is required. Account allowlist and blacklist checks do not apply. Browser
        requests with an Origin must use one configured on the server.
